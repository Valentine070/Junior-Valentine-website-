<!DOCTYPE html>
<html>
<head>
  <title>Junior Valentine</title>

  <style>

    body{
      margin:0;
      background:#0f0f0f;
      color:white;
      font-family:Arial;
      overflow-x:hidden;
    }

    .navbar{
      background:black;
      padding:20px;
      text-align:center;
      position:sticky;
      top:0;
    }

    .navbar a{
      color:gold;
      text-decoration:none;
      margin:15px;
      font-size:18px;
    }

    .hero{
      text-align:center;
      padding:80px 20px;
      animation:fadeIn 2s;
    }

    .hero img{
      width:150px;
      height:150px;
      border-radius:50%;
      border:4px solid gold;
      animation:float 3s infinite;
    }

    h1{
      color:gold;
      font-size:40px;
    }

    p{
      font-size:18px;
    }

    button{
      background:gold;
      border:none;
      padding:15px 25px;
      font-size:18px;
      border-radius:10px;
      margin-top:20px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.1);
    }

    .about{
      padding:40px;
      text-align:center;
      background:#1a1a1a;
    }

    .skills{
      padding:40px;
      text-align:center;
    }

    .box{
      background:#1f1f1f;
      margin:15px;
      padding:20px;
      border-radius:15px;
      transition:0.3s;
    }

    .box:hover{
      transform:translateY(-10px);
      background:gold;
      color:black;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
      }

      to{
        opacity:1;
      }
    }

    @keyframes float{
      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-15px);
      }

      100%{
        transform:translateY(0px);
      }
    }

  </style>
</head>

<body>

  <div class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Trading</a>
    <a href="#">Contact</a>
  </div>

  <div class="hero">

    <img src="https://i.imgur.com/8Km9tLL.png">

    <h1>Junior Valentine</h1>

    <p>Future Trader & Web Developer</p>

    <button onclick="showMessage()">
      Join My Journey
    </button>

  </div>

  <div class="about">

    <h2>About Me</h2>

    <p>
      I am learning trading and web development using only my phone.
    </p>

  </div>

  <div class="skills">

    <h2>What I Am Learning</h2>

    <div class="box">
      Trading
    </div>

    <div class="box">
      Web Development
    </div>

    <div class="box">
      Crypto
    </div>

  </div>

  <script>

    function showMessage(){
      alert("Welcome to Junior Valentine's Website 🔥");
    }

  </script>

</body>
</html>
